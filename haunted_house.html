<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Ház a lámpákkal</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 90vmin;
    height: 90vmin;
  }
  .window {
    cursor: pointer;
    fill: #ffffff;
    transition: fill 0.2s ease;
  }
  .window.lit {
    fill: #ffd84d;
  }
  .window:hover {
    fill: #fff3cc;
  }
  .window.lit:hover {
    fill: #ffd84d;
  }
  .glow {
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .window.lit + .glow,
  .glow.lit {
    opacity: 1;
  }
</style>
</head>
<body>

<svg viewBox="0 0 736 736" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe17a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe17a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== HÁZ (fekete sziluett, az eredeti kép alapján) ===================== -->
  <g id="house" fill="#000000">
    <!-- bal kis torony teteje -->
    <polygon points="165,135 253,35 341,135"/>
    <!-- bal kis torony teste -->
    <rect x="178" y="135" width="150" height="95"/>

    <!-- jobb torony teteje -->
    <polygon points="423,120 500,25 578,120"/>
    <!-- jobb torony teste (hosszú, a föld szintig) -->
    <rect x="440" y="120" width="120" height="600"/>

    <!-- fő tető (középső rész, kinyúló) -->
    <polygon points="150,320 440,320 480,230 165,230"/>

    <!-- fő épület test (2. és 3. emelet) -->
    <rect x="178" y="320" width="262" height="140"/>

    <!-- alsó kinyúló tető rész -->
    <polygon points="150,460 440,460 440,500 150,500"/>
    <polygon points="150,500 440,500 480,460 150,460"/>

    <!-- földszint teste -->
    <rect x="178" y="500" width="262" height="200"/>

    <!-- bejárati kis tető -->
    <polygon points="250,480 310,430 370,480"/>
    <!-- bejárati oszlopok / keret -->
    <rect x="250" y="480" width="10" height="50"/>
    <rect x="360" y="480" width="10" height="50"/>

    <!-- lépcsők -->
    <rect x="235" y="700" width="270" height="12"/>
    <rect x="245" y="712" width="250" height="10"/>

    <!-- torony alapja -->
    <rect x="440" y="700" width="120" height="20"/>
  </g>

  <!-- ===================== DÍSZ (nem kattintható) ===================== -->
  <g fill="#ffffff">
    <!-- kerek ablak a tetőn -->
    <circle cx="310" cy="275" r="26" fill="#ffffff"/>
    <g stroke="#000000" stroke-width="3">
      <line x1="310" y1="249" x2="310" y2="301"/>
      <line x1="284" y1="275" x2="336" y2="275"/>
      <line x1="292" y1="257" x2="328" y2="293"/>
      <line x1="292" y1="293" x2="328" y2="257"/>
    </g>
    <circle cx="310" cy="275" r="26" fill="none" stroke="#000000" stroke-width="3"/>

    <!-- csíkos deszkázás (dísz, nem ablak) -->
    <g fill="#ffffff">
      <rect x="207" y="345" width="70" height="10"/>
      <rect x="207" y="362" width="70" height="10"/>
      <rect x="207" y="379" width="70" height="10"/>
      <rect x="207" y="396" width="70" height="10"/>
    </g>

    <!-- ajtó -->
    <rect x="270" y="530" width="80" height="150" fill="#ffffff"/>
    <line x1="310" y1="530" x2="310" y2="680" stroke="#000000" stroke-width="3"/>
    <line x1="270" y1="580" x2="350" y2="580" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- ===================== ABLAKOK (kattinthatók) + fények ===================== -->
  <!-- minden ablakhoz tartozik egy glow kör, ami a lámpa fényét adja -->

  <!-- bal kis torony ablaka -->
  <circle class="glow" cx="253" cy="180" r="55" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w1">
    <path class="window" d="M225,195 L225,150 A28,28 0 0 1 281,150 L281,195 Z"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="253" y1="150" x2="253" y2="195"/>
      <line x1="225" y1="172" x2="281" y2="172"/>
    </g>
  </g>

  <!-- jobb torony - 1. (legfelső) ablak -->
  <circle class="glow" cx="500" cy="190" r="55" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w2">
    <path class="window" d="M472,205 L472,160 A28,28 0 0 1 528,160 L528,205 Z"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="500" y1="160" x2="500" y2="205"/>
      <line x1="472" y1="182" x2="528" y2="182"/>
    </g>
  </g>

  <!-- jobb torony - 2. ablak -->
  <circle class="glow" cx="500" cy="365" r="55" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w3">
    <path class="window" d="M472,380 L472,335 A28,28 0 0 1 528,335 L528,380 Z"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="500" y1="335" x2="500" y2="380"/>
      <line x1="472" y1="357" x2="528" y2="357"/>
    </g>
  </g>

  <!-- jobb torony - 3. (alsó) ablak -->
  <circle class="glow" cx="500" cy="600" r="55" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w4">
    <path class="window" d="M472,615 L472,570 A28,28 0 0 1 528,570 L528,615 Z"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="500" y1="570" x2="500" y2="615"/>
      <line x1="472" y1="592" x2="528" y2="592"/>
    </g>
  </g>

  <!-- középső emelet - bal ablak (négyzetes) -->
  <circle class="glow" cx="320" cy="375" r="45" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w5">
    <rect class="window" x="297" y="345" width="46" height="60"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="320" y1="345" x2="320" y2="405"/>
      <line x1="297" y1="375" x2="343" y2="375"/>
    </g>
  </g>

  <!-- középső emelet - jobb ablak (négyzetes) -->
  <circle class="glow" cx="400" cy="375" r="45" fill="url(#glowGrad)"/>
  <g class="window-group" data-id="w6">
    <rect class="window" x="377" y="345" width="46" height="60"/>
    <g stroke="#000000" stroke-width="3" pointer-events="none">
      <line x1="400" y1="345" x2="400" y2="405"/>
      <line x1="377" y1="375" x2="423" y2="375"/>
    </g>
  </g>

</svg>

<script>
  document.querySelectorAll('.window-group').forEach(function (group) {
    var win = group.querySelector('.window');
    var glow = group.previousElementSibling; // a glow kör közvetlenül előtte van
    group.addEventListener('click', function () {
      win.classList.toggle('lit');
      glow.classList.toggle('lit');
    });
  });
</script>

</body>
</html>
